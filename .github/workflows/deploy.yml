---
name: "Deploy"

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:

env:
  MODULE_NAME: aiolyric

jobs:
  deploy:
    name: 🚀 Linux - Deploy Module
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: "master"
          token: ${{ secrets.PUSH_TOKEN }}
      - name: 🏗 Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          architecture: "x64"
          cache: "pip"
      - name: 🏗 Install build tooling
        run: |
          python -m pip install --upgrade setuptools wheel twine
      - name: 🔢 Get old version
        id: get-version-old
        run: |
          result=$(python script/get_version.py)
          echo "version=$result" >> $GITHUB_OUTPUT
      - name: 🔢 Set correct version - Development
        if: ${{ github.event_name != 'release' }}
        run: |
          python script/set_dev_version.py
      - name: 🔢 Set correct version - Release
        if: ${{ github.event_name == 'release' }}
        run: |
          python script/set_release_version.py
      - name: 🔢 Get current version
        id: get-version-current
        run: |
          result=$(python script/get_version.py)
          echo "version=$result" >> $GITHUB_OUTPUT
      - name: ⤵️ Pull latest changes from GitHub
        run: |
          git pull --ff
      - name: 🖊 Commit
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        with:
          commit_message: |
            Bump ${{ env.MODULE_NAME }} version to ${{ steps.get-version-current.outputs.version }}
      - name: 🏗 Build distributions
        run: |
          python setup.py sdist bdist_wheel
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          verbose: true
      - name: 🔢 Increment version - Development
        if: ${{ github.event_name != 'release' }}
        run: |
          python script/increment_version_dev.py
      - name: 🔢 Increment version - Release
        if: ${{ github.event_name == 'release' }}
        run: |
          python script/increment_version_release.py
      - name: 🔢 Get new version
        id: get-version-new
        run: |
          result=$(python script/get_version.py)
          echo "version=$result" >> $GITHUB_OUTPUT
      - name: ⤵️ Pull latest changes from GitHub
        run: |
          git pull --ff
      - name: 🖊 Commit
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.PUSH_TOKEN }}
        with:
          commit_message: |
            Bump ${{ env.MODULE_NAME }} version to ${{ steps.get-version-new.outputs.version }}
