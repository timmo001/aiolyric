---
name: "CodeQL"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analyze-python:
    uses: timmo001/workflows/.github/workflows/codeql-python.yml@db6f3692a31de24d2bee17e505dfd2bf3fd5a076 # 20261116.1
